services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: moeurl
      POSTGRES_USER: moeurl
      POSTGRES_PASSWORD: ${MOEURL_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moeurl -d moeurl"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOEURL_ENV: ${MOEURL_ENV:-production}
      MOEURL_HTTP_ADDR: :8080
      MOEURL_STATIC_DIR: /app/web
      MOEURL_ANALYTICS_COUNTRY_HEADER: ${MOEURL_ANALYTICS_COUNTRY_HEADER:-}
      MOEURL_DATABASE_URL: postgres://moeurl:${MOEURL_POSTGRES_PASSWORD:?required}@postgres:5432/moeurl?sslmode=disable
      MOEURL_SETUP_TOKEN: ${MOEURL_SETUP_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    init: true
    ports:
      - "${MOEURL_HTTP_HOST:-127.0.0.1}:${MOEURL_HTTP_PORT:-8080}:8080"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 20s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    user: "10001:10001"

volumes:
  postgres-data:
